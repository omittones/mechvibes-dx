[workspace]
members = [
    "crates/mechvibes-core",
    "crates/mechvibes-desktop",
    "crates/mechvibes-cli",
]
resolver = "2"

[workspace.dependencies]
# Shared versions pinned once here
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11.6"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21.3"
